BOARDFAMILY="rockchip-rk3568-z96a"
BOARD_MAINTAINER="z96a-Bingo"
# Use z96a defconfig (includes FIT support for u-boot.itb)
BOOTCONFIG="z96a-rk3568-laptop-v2_defconfig"
LINUXCONFIG="linux-rockchip-rk3568-z96a-legacy"
KERNEL_TARGET="legacy"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3568-z96a-laptop-v2.dtb"
BOOTSCRIPT='boot-z96a-rk3568-laptop-v2.cmd:boot.cmd'
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="spl-blobs"
BOOTFS_TYPE="fat"

# Rockchip multimedia userspace (MPP/RGA/RKNN/GLES) via extension.
# Appends to ENABLE_EXTENSIONS passed via env/workflow input, if any.
if [[ -n "${ENABLE_EXTENSIONS:-}" ]]; then
	ENABLE_EXTENSIONS="${ENABLE_EXTENSIONS},rockchip-multimedia"
else
	ENABLE_EXTENSIONS="rockchip-multimedia"
fi

# Factory Android 5042 DDR policy (lp4x top 1184, FSP 324/528/780, PHY 29/36/36)
# Extracted/applied from z96a-extract/z96a-5042-loader.bin — not generic 1560 blob
DDR_BLOB="rk35/rk3568_ddr_1184MHz_android5042_z96a.bin"
