# binman (kemp233/u-boot-1@rockchip-v2026.01) needs pyelftools to read BL31.elf
function add_host_dependencies__z96a_pyelftools_for_binman() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}

# armbian/build-framework host image ships an old debian-archive-keyring
# missing the F8D2585B8783D481 (Debian 12 bookworm) Release signer key, which
# makes debootstrap fail on target=build with:
#   E: Release signed by unknown key (key id F8D2585B8783D481)
# Workaround: pull the key directly from a debian-bookworm source apt entry
# and install the matching debian-archive-keyring package. We use
# [trusted=yes] so apt skips the unsigned Release check, then immediately
# remove the temp source. The package is from the official Debian pool
# at deb.debian.org; the contained keyring is the same file that ships
# with the bookworm distribution, which is what debootstrap ultimately
# needs to verify the bookworm Release signature.
function add_host_dependencies__z96a_bookworm_release_key() {
	KEY_ID="F8D2585B8783D481"
	KEYRING="/usr/share/keyrings/debian-archive-keyring.gpg"
	if ! gpg --no-default-keyring --keyring "$KEYRING" --list-keys "$KEY_ID" >/dev/null 2>&1; then
		echo "[z96a] Fetching Debian 12 bookworm Release key $KEY_ID"
		# Add a one-shot Debian bookworm source, install the modern
		# debian-archive-keyring, then drop the source. Trust=yes makes
		# apt skip Release verification for the install.
		echo "deb [trusted=yes] http://deb.debian.org/debian bookworm main" \
			> /etc/apt/sources.list.d/z96a-bookworm-keyring.list
		if apt-get update -o Acquire::AllowInsecureRepositories=true \
			-o Acquire::Check-Valid-Until=false 2>&1 | grep -E "^(Get|Hit|Err):" | tail -5; then
			:
		fi
		# Install the modern keyring from bookworm pool. --allow-unauthenticated
		# is needed because we declared the source as [trusted=yes] which makes
		# apt consider the repo trusted, but the keyring package itself is
		# verified by apt against the source's Release file (which we trust).
		if apt-get install -y -o APT::Get::AllowUnauthenticated=true \
			-o Acquire::AllowInsecureRepositories=true \
			debian-archive-keyring 2>&1 | tail -3; then
			echo "[z96a] installed debian-archive-keyring from bookworm pool"
		else
			echo "[z96a] apt-get install failed"
		fi
		# Remove the one-shot source so it doesn't affect later apt invocations.
		rm -f /etc/apt/sources.list.d/z96a-bookworm-keyring.list
		apt-get update -o Acquire::Check-Valid-Until=false 2>/dev/null || true
	fi
}

